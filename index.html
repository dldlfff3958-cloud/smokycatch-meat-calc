  <style>
    /* 全域背景：深色工業水泥感 */
    body {
      font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
      background-color: #1a1a1a;
      background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://www.transparenttextures.com/patterns/dark-matter.png');
      color: #e0e0e0;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    /* 主卡片：深木頭色與金屬邊框 */
    .container {
      width: 100%;
      max-width: 400px;
      background: #3e2723; /* 深胡桃木色 */
      border: 4px solid #5d4037;
      border-radius: 8px;
      padding: 30px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 50px rgba(0,0,0,0.5);
      position: relative;
    }

    /* 裝飾性的小鉚釘感 */
    .container::before, .container::after {
      content: "•";
      position: absolute;
      color: #8d6e63;
      font-size: 20px;
      top: 5px;
    }
    .container::before { left: 10px; }
    .container::after { right: 10px; }

    h1 {
      color: #d35400; /* 鐵鏽銅色 */
      text-align: center;
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 0;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      border-bottom: 2px dashed #5d4037;
      padding-bottom: 15px;
    }

    .input-group {
      margin-top: 25px;
    }

    label {
      display: block;
      margin-bottom: 12px;
      font-weight: bold;
      color: #bcaaa4;
      font-size: 0.9rem;
    }
