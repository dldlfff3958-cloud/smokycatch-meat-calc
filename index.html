<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>職人醃肉計算器</title>
  <style>
    /* 工業風背景 */
    body {
      font-family: sans-serif;
      background-color: #2c2c2c; /* 深灰色水泥感 */
      color: #eeeeee;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 主容器：深色木質 */
    .container {
      width: 100%;
      max-width: 360px;
      background-color: #4e342e; /* 褐色木頭 */
      border: 3px solid #6d4c41;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      box-sizing: border-box;
    }

    h1 {
      color: #ff9800; /* 亮橘色 */
      text-align: center;
      font-size: 1.5rem;
      margin-top: 0;
      border-bottom: 1px solid #6d4c41;
      padding-bottom: 10px;
    }

    .input-group {
      margin: 20px 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #d7ccc8;
      font-size: 1rem;
    }

    /* 輸入框：強制白色背景，保證看得見 */
    input[type="number"] {
      width: 100%;
      height: 60px; /* 加高一點好點擊 */
      padding: 10px;
      font-size: 2rem;
      background-color: #ffffff !important; 
      color: #000000 !important;
      border: 4px solid #ff9800; /* 橘色金屬邊框 */
      border-radius: 8px;
      box-sizing: border-box;
      outline: none;
      text-align: center;
    }

    /* 結果顯示區 */
    .result {
      margin-top: 20px;
      padding: 15px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      /* 預設隱藏，輸入後會顯示 */
      display: none; 
    }

    .result-item {
      margin-bottom: 15px;
      font-size: 1.1rem;
      border-bottom: 1px solid #5d4037;
      padding-bottom: 5px;
    }

    .value-text {
      color: #ffeb3b; /* 亮黃色數字 */
      font-weight: bold;
      font-size: 1.4rem;
      float: right;
    }

    .note {
      font-size: 0.8rem;
      color: #a1887f;
      text-align: center;
      margin-top: 15px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>職人醃肉計算</h1>

    <div class="input-group">
      <label for="meatInput">請輸入肉量 (g):</label>
      <input type="number" id="meatInput" placeholder="點擊輸入" oninput="calculate()" inputmode="decimal" autofocus>
    </div>

    <div class="result" id="resultBox">
      <div class="result-item">
        亞硝酸鹽 (0.15%) 
        <span class="value-text"><span id="nitrite">0</span> g</span>
      </div>
      
      <div class="result-item">
        混合液 (5.0%) 
        <span class="value-text"><span id="smokeOil">0</span> g</span>
      </div>

      <div class="note">
        混合液比例：燻油1、老抽1、鹽1、水2
      </div>
    </div>
  </div>

  <script>
    function calculate() {
      const meatWeight = parseFloat(document.getElementById('meatInput').value);
      const resultBox = document.getElementById('resultBox');

      if (!isNaN(meatWeight) && meatWeight > 0) {
        document.getElementById('nitrite').innerText = (meatWeight * 0.0015).toFixed(2);
        document.getElementById('smokeOil').innerText = (meatWeight * 0.05).toFixed(2);
        resultBox.style.display = 'block';
      } else {
        resultBox.style.display = 'none';
      }
    }
  </script>
</body>
</html>
